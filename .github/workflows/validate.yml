name: Offline reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts\validate_repository.py
      - run: python -m pip wheel --no-deps --wheel-dir .local\wheel .
      - run: python -m pip_audit --no-deps --disable-pip --strict -r requirements-sdk.lock
      - run: dotnet tool restore --verbosity quiet
      - run: dotnet a365 --version
  sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r requirements-sdk.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts\validate_repository.py
