name: Approved live read smoke
on:
  workflow_dispatch:
    inputs:
      approved:
        type: boolean
        required: true
        default: false
        description: Confirm approved directory-audit read and environment prerequisites
permissions:
  contents: read
jobs:
  read-only-smoke:
    if: inputs.approved && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: tenant-read-smoke
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install ".[azure]"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_READ_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: python -m unittest discover -s tests -p test_live.py -v
        env:
          RUN_LIVE_READ_TESTS: 'true'
          LIVE_AUTH_MODE: cli
